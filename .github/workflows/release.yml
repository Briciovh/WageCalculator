name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Version
        run: |
          BASE_NAME=$(grep "^VERSION_NAME=" gradle.properties | cut -d= -f2)
          BASE_CODE=$(grep "^VERSION_CODE_BASE=" gradle.properties | cut -d= -f2)
          BUILD_NUM=${GITHUB_RUN_NUMBER:-0}
          VERSION_CODE=$((BASE_CODE + BUILD_NUM))
          if [ "$BUILD_NUM" -gt 0 ]; then
            VERSION_NAME="$BASE_NAME.$BUILD_NUM"
          else
            VERSION_NAME="$BASE_NAME"
          fi
          echo "Building version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/salary-release.aab
