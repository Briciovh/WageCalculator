name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Version
        run: |
          VERSION_NAME=$(git describe --tags --always)
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "Building version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/salary-release.aab
